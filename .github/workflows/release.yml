name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be v<SemVer>" >&2
            exit 1
          fi
          manifest_version="$(python -c 'import json; print(json.load(open("custom_components/domee/manifest.json"))["version"])')"
          test "$version" = "$manifest_version"

      - name: Validate metadata and privacy
        run: |
          python validation/metadata_guard.py --release
          python validation/secret_scan.py

      - name: Test minimum Home Assistant
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace:ro"
          --workdir /workspace
          --env PYTHONPATH=/workspace
          ghcr.io/home-assistant/home-assistant:2024.3.3
          python -m pytest -q -p no:cacheprovider tests

      - name: Test stable Home Assistant and coverage
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace:ro"
          --workdir /workspace
          --env PYTHONPATH=/workspace
          --env COVERAGE_FILE=/tmp/.coverage
          ghcr.io/home-assistant/home-assistant:stable
          sh -c
          "python -m coverage run --branch --source=custom_components/domee -m pytest -q -p no:cacheprovider tests &&
          python -m coverage report --fail-under=85"

      - name: Compile integration
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/custom_components/domee:/component:ro"
          --env PYTHONPYCACHEPREFIX=/tmp/pycache
          ghcr.io/home-assistant/home-assistant:stable
          python -m compileall -q /component

      - name: Check Home Assistant configuration
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}/validation/config:/source-config:ro"
          --volume "${{ github.workspace }}/custom_components/domee:/source-component:ro"
          ghcr.io/home-assistant/home-assistant:stable
          sh -c
          "mkdir -p /tmp/config/custom_components &&
          cp -R /source-config/. /tmp/config/ &&
          cp -R /source-component /tmp/config/custom_components/domee &&
          python -m homeassistant --script check_config --config /tmp/config"

      - name: Ruff
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace:ro"
          --workdir /workspace
          ghcr.io/astral-sh/ruff:0.12.9-alpine
          ruff check --no-cache custom_components/domee tests validation scripts

      - name: Hassfest
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/github/workspace:ro"
          ghcr.io/home-assistant/hassfest:latest

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
      - name: Build and verify deterministic artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          first="$(sha256sum domee.zip | cut -d' ' -f1)"
          cp domee.zip /tmp/domee-first.zip
          python scripts/build_release.py
          second="$(sha256sum domee.zip | cut -d' ' -f1)"
          test "$first" = "$second"
          cmp /tmp/domee-first.zip domee.zip
          python validation/validate_package.py
          python validation/inspect_release_artifact.py
          printf '%s  domee.zip\n' "$second" > domee.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          domee.zip domee.zip.sha256
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md